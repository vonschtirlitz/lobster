<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOBSTER</title>
    <meta name="description" content="Line Order Builder &amp; Simulated Troop Evolution Rehearser: plan and replay 18th-century line-infantry drill." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="app">
      <header class="toolbar" id="toolbar"></header>
      <main class="field" id="field">
        <canvas id="canvas" tabindex="0" aria-label="Drill field. With a company selected: arrow keys move it, [ and ] rotate it, + and - change its depth. Hold Shift for bigger steps."></canvas>
        <div class="hint">Drag to move · handle to rotate · right-drag to set frontage · wheel to zoom<br />Keys: arrows move · [ ] rotate · + − depth · Shift for bigger steps</div>
      </main>
      <footer class="replay" id="replay"></footer>
      <aside class="side">
        <section id="setup"></section>
        <section id="orders"></section>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
