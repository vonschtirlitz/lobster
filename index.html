<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="app">
      <header class="toolbar" id="toolbar"><h1>Order Planner</h1></header>
      <main class="field" id="field">
        <canvas id="canvas" aria-label="Drill field"></canvas>
        <div class="hint">Drag to move · handle to rotate · right-drag to set frontage · wheel to zoom</div>
      </main>
      <footer class="replay" id="replay"></footer>
      <aside class="side">
        <section id="setup"></section>
        <section id="orders"></section>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
